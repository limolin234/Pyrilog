[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "Pyrilog"
version = "1.0.0"
description = "A relation-based Python language for hierarchical circuit modeling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pint>=0.25,<0.26"]

[tool.setuptools.packages.find]
include = ["pyrilog*"]
